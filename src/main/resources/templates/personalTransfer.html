<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


</head>
<body>
<div class="content">
    <div th:replace="fragments/header :: header"></div>


    <div class="container d-flex justify-content-center">

        <div class="card p-4 shadow" style="width: 350px; margin-bottom: 12%;">

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <p class="text-center">Instant transfer</p>

            <form th:action="@{/personalTransfer}" method="post">
                <div class="mb-3">
                    <label for="iban"></label>
                    <select id="iban" name="iban" class="form-select mb-2" required>
                        <option value="">--Select IBAN --</option>

                        <option th:each="saved : ${savedIbans}"
                                th:value="${saved.iban}"
                                th:text="${saved.bankName + ' - ' + saved.iban}">
                        </option>
                    </select>
                    <input type="text" id="amount" name="amount" class="form-control" placeholder="Amount €" >
                </div>
                <div class="d-grid">
                    <input class="btn-start btn-sm" type="submit" value="Transfer">
                </div>
            </form>

        </div>
    </div>
</div>
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
