<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


</head>
<body>
<div class="content">
    <div th:replace="fragments/header :: header"></div>
    <div class="container d-flex justify-content-center" style="margin: 7%;">
        <div class="card p-4 shadow" style="width: 450px;">

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <p class="text-center">Instant transfer</p>

            <form th:action="@{/personalTransfer}" method="post">
                <div class="mb-3">
                    <label for="Iban"></label>
                    <select id="Iban" name="Iban" class="form-select mb-2" required>
                        <option value=""></option>

                        <option th:each="saved : ${savedIbans}"
                                th:value="${saved.iban}"
                                th:text="${saved.bankName + ' - ' + saved.iban}">
                        </option>
                    </select>
                    <label for="amount"></label>
                    <input type="text" id="amount" name="amount" class="form-control" placeholder="Amount €" required>
                </div>
                <div class="d-grid">
                    <input class="btn-start btn-sm" type="submit" value="Transfer">
                </div>
            </form>

        </div>
    </div>
</div>
<div th:replace="fragments/footer :: footer"></div>
<script>
    new TomSelect('#iban', {
        placeholder: 'Select an Iban...',
        allowEmptyOption: true,
        items:[]
    });
</script>
</body>
</html>
