<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


</head>
<body>
<div th:replace="fragments/header :: header"></div>
<div class="content">
    <div class="container d-flex justify-content-center" style="margin: 7%;">

        <div class="card p-4 shadow" style="width: 450px;">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <table class="table table-hover ">
                <thead >
                <tr class="d-flex justify-content-center">
                    <th style="border-btn: none">Contact List</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="link : ${user.links}">
                    <td th:text="${link.userFriend.firstName}"></td>

                    <td>
                        <form th:action="@{/deleteLink/{id}(id=${link.id})}"
                              method="post"
                              onsubmit="return confirm('Delete this friend ?');">

                            <button type="submit" class="btn btn-danger btn-sm">
                                Delete
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

            <a th:href="@{/addFriend}" class="btn btn-primary btn-sm">
                <i class="ti ti-player-play"></i>
                Add
            </a>
        </div>
    </div>
</div>
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
