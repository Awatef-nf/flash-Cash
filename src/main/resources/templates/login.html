<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashCash-Home</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
<!-- RIGHT LOGIN CARD -->
<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="card shadow-lg p-4" style="width: 420px;">

        <!-- HEADER -->
        <div class="text-center mb-4">

            <div class="bg-primary bg-gradient text-white rounded-circle d-inline-flex justify-content-center align-items-center"
                 style="width:80px;height:80px;">

                <i class="bi bi-shield-lock-fill fs-1"></i>

            </div>

            <h3 class="fw-bold mt-3">
                Connexion
            </h3>

            <p class="text-muted">
                Accédez à votre espace sécurisé
            </p>

        </div>

        <!-- FORM -->
        <form th:action="@{/login}" method="post">

            <!-- EMAIL -->
            <div class="mb-3">

                <label for="email" class="form-label fw-semibold">
                    Email
                </label>

                <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-envelope-fill"></i>
                                </span>

                    <input type="email"
                           id="email"
                           name="email"
                           class="form-control"
                           placeholder="Enter your email"
                           required>
                </div>
            </div>

            <!-- PASSWORD -->
            <div class="mb-4">

                <label for="password" class="form-label fw-semibold">
                    Password
                </label>

                <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-lock-fill"></i>
                                </span>

                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control"
                           placeholder="Enter your password"
                           required>
                </div>
            </div>

            <!-- BUTTON -->
            <div class="d-grid mb-3">

                <button type="submit"
                        class="btn btn-primary btn-lg rounded-3">

                    <i class="bi bi-box-arrow-in-right"></i>
                    Sign In

                </button>

            </div>

            <!-- REGISTER -->
            <div class="text-center">

                <small class="text-muted">
                    Don’t have an account?
                </small>

                <a th:href="@{/register}"
                   class="text-primary fw-semibold text-decoration-none ms-1">

                    Sign Up

                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
