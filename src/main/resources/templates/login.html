<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- HEADER -->
<header class="p-3">
    <div class="d-flex justify-content-between align-items-center">
        <!-- Logo -->
        <img class="logo-header" th:src="@{/img/flash_cash_logo.png}" alt="logo" height="45">
    </div>
</header>

<!-- LOGIN CARD -->
<div class="container d-flex justify-content-start align-items-center justify-content-center">

    <div class="card p-4 shadow" style="width: 350px;">

        <h3 class="text-center mb-4">Authentification</h3>

        <!-- UN SEUL FORMULAIRE -->
        <form th:action="@{/login}" method="post">

            <!-- EMAIL -->
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email"
                       id="email"
                       name="email"
                       class="form-control"
                       placeholder="email"
                       required>
            </div>

            <!-- PASSWORD -->
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password"
                       id="password"
                       name="password"
                       class="form-control"
                       placeholder="Password"
                       required>
            </div>

            <!-- BUTTONS -->
            <div class="d-flex justify-content-between">

                <button type="submit" class="btn btn-primary btn-sm">
                    Sign in
                </button>

                <a th:href="@{/register}" class="btn btn-primary btn-sm">
                    Sign up
                </a>

            </div>

        </form>

    </div>

</div>

<!-- FOOTER -->
<footer >
    <div id="footer-margin" class="card p-4 shadow">
    <div class="container d-flex align-items-center justify-content-between">
        <!-- Logo -->
        <div class="logo-footer">
            <img th:src="@{/img/flash_cash_logo.png}" alt="Image" >
        </div>

        <!-- Section 1 -->
        <div class="d-flex flex-column">
            <h5>Cash transfer</h5>
            <a href="#">FAQ</a>
            <a href="#">Why using FlashCash</a>
        </div>

        <!-- Section 2 -->
        <div class="d-flex flex-column">
            <h5>Need help?</h5>
            <a href="#">Live chat</a>
            <a href="#">Contact us</a>
        </div>

        <!-- Section 3 -->
        <div class="d-flex flex-column">
            <h5>About</h5>
            <a href="#">Team</a>
            <a href="#">Locations</a>
        </div>

    </div>
    </div>
</footer>

</body>
</html>
