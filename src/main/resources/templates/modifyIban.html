<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>
<body>

<div class="content">
    <div th:replace="fragments/header :: header"></div>

    <div class="container d-flex justify-content-center" style="margin: 7%;">

        <div class="card p-4 shadow" style="width: 450px;">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <form th:action="@{/modifyIban/{id}(id=${ibanData.id})}" method="post">

                <input type="text"
                       name="bankName"
                       th:value="${ibanData.bankName}"
                       class="form-control mb-2">

                <input type="text"
                       name="iban"
                       th:value="${ibanData.iban}"
                       class="form-control mb-2">

                <button type="submit" class="btn btn-success">
                    Save
                </button>

            </form>
        </div>
    </div>
</div>
<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
