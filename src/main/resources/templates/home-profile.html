
<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlashCash-Home</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="content">
    <header>
        <div class="d-flex align-items-center mt-2 px-4">
            <!-- NAV -->
            <nav class="d-flex gap-4 ms-auto align-items-center " style="margin-right: 7%;">

                <a th:href="@{/profile}"
                   class="btn bg-clr btn-lg rounded-5" style="font-size: 16px">
                    <i class="bi bi-house"></i> My account
                </a>

                <a  class="d-flex gap-2 btn btn-primary btn-lg rounded-5" style="font-size: 16px"
                    href="#"
                    onclick="document.getElementById('logout-form').submit()">
                    <i class="bi bi-box-arrow-right"></i>
                    Logout
                </a>

                <form id="logout-form" th:action="@{/logout}" method="post" style="display:none"></form>
            </nav>
        </div>
    </header>
    <!-- HERO SECTION -->
    <section class=" d-flex align-items-center">
        <div class="container">
            <div class="row align-items-center g-5">

                <!-- LEFT -->
                <div class="col-lg-6">

                    <div class="d-flex align-items-center mb-3">

                        <div class="bg-clr text-white rounded-circle d-flex justify-content-center align-items-center"
                             style="width:130px;height:130px; margin: 7% 0 10% 10%;">
                            <i class="bi bi-wallet2 " style="font-size:4.5rem"></i>
                        </div>

                        <div class="ms-3">
                            <h1 class="fw-bold text-primary mb-0" style="width: 72px">
                                FlashCash
                            </h1>

                            <p class="text-muted mb-0">
                                Fast and secure transfers
                            </p>
                        </div>
                    </div>

                    <p class="lead text-secondary mt-3">
                                Now, you can add funds to your account
                        directly from your bank account,securely transfer money
                            to your friends any time you want
                                  manage your profile
                        and enjoy all our financial services
                    </p>

                </div>

                <!-- RIGHT -->
                <div class="col-lg-6">
                    <div class="d-flex align-items-stretch h-100">
                        <img src="/img/magnific__assistant__35033.png"
                             class="img-fluid w-100 rounded"
                             style="object-fit: cover; max-height: 500px;"
                             alt="Responsive image">
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>
    <!-- FOOTER -->
    <div th:replace="fragments/footer :: footer"></div>

</body>
</html>
