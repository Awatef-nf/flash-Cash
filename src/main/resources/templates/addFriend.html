<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>

</head>
<body>
<div th:replace="fragments/header :: header"></div>
<div class="content">

    <div class="container d-flex justify-content-center" style="margin: 7%;">

        <div class="card p-4 shadow" style="width: 450px;">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <form th:action="@{/addFriend}" method="post">
                <div class="mb-3">
                    <label for="emailFriend"></label>
                    <select id="emailFriend"
                            name="friendEmail"
                            class="form-control mb-2"
                            required>

                        <option value=""></option>
                        <option th:each="user : ${users}"
                                th:value="${user.email}"
                                th:text="${user.email}">
                        </option>

                    </select>
                </div>

                <div class="d-grid">
                    <input class="btn-start btn-sm" type="submit" value="Add">
                </div>

            </form>
    </div>


</div>
</div>
<div th:replace="fragments/footer :: footer"></div>
<script>
    new TomSelect('#emailFriend', {
        placeholder: 'Search a friend...',
        allowEmptyOption: true,
        items:[]
    });
</script>
</body>
</html>
