<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/tom-select/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select/dist/js/tom-select.complete.min.js"></script>


</head>
<body>
<div th:replace="fragments/header :: header"></div>
<div class="content">
    <div class="container d-flex justify-content-center" style="margin: 7%;">

        <div class="card p-4 shadow" style="width: 450px;">

        <p class="text-center">Instant transfer to your Bank</p>

        <form th:action="@{/addCash}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="mb-3">
                <label for="iban"></label>
                <select id="iban" name="iban" class="form-control mb-2" required>
                    <option value=""></option>
                    <option th:each="saved : ${savedIbans}"
                            th:value="${saved.iban}"
                            th:text="${saved.bankName + ' - ' + saved.iban}">
                    </option>
                </select>
                <label for="amount"></label><input type="text" id="amount" name="amount" class="form-control" placeholder="Amount €" required>
            </div>
            <div class="d-grid">
                <input class="btn-start btn-sm" type="submit" value="Transfer">
            </div>
        </form>

    </div>
</div>
</div>
<div th:replace="fragments/footer :: footer"></div>
<script>
    new TomSelect('#iban', {
        placeholder: 'Search an Iban...',
        allowEmptyOption: true,
        items:[]
    });
</script>
</body>
</html>
