<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign up</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- Bootstrap CDN -->
    <link href="/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="content">
<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="card shadow-lg p-4" style="width: 420px;">

        <!-- HEADER -->
        <div class="text-center mb-4">

            <div class="icon-circle bg-primary text-white mx-auto">
                <i class="bi bi-person-circle fs-1"></i>
            </div>

            <h3 class="mt-3 fw-bold">Create Account</h3>
            <p class="text-muted">Join FlashCash in seconds</p>

        </div>

        <!-- FORM -->
        <form th:action="@{/register}" th:object="${user}" method="post">

            <!-- ERROR -->
            <div th:if="${error}" class="alert alert-danger py-2">
                <span th:text="${error}"></span>
            </div>

            <!-- FIRST NAME -->
            <div class="mb-2">
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-person"></i>
                    </span>
                    <input type="text"
                           class="form-control"
                           th:field="*{firstName}"
                           placeholder="First name"
                           required>
                </div>
            </div>

            <!-- LAST NAME -->
            <div class="mb-2">
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-person-badge"></i>
                    </span>
                    <input type="text"
                           class="form-control"
                           th:field="*{lastName}"
                           placeholder="Last name"
                           required>
                </div>
            </div>

            <!-- EMAIL -->
            <div class="mb-2">
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input type="email"
                           class="form-control"
                           th:field="*{email}"
                           placeholder="Email"
                           required>
                </div>
            </div>

            <!-- PASSWORD -->
            <div class="mb-3">
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password"
                           class="form-control"
                           th:field="*{password}"
                           placeholder="Password"
                           required>
                </div>
            </div>

            <!-- BUTTON -->
            <button type="submit" class="btn btn-primary w-100 py-2">
                <i class="bi bi-check-circle"></i> Sign Up
            </button>

        </form>

        <!-- FOOTER -->
        <div class="text-center mt-3">
            <small>Already have an account?</small>
            <a th:href="@{/login}" class="text-primary fw-semibold text-decoration-none">
                Login
            </a>
        </div>

    </div>

</div>
</div>
</body>
<!-- FOOTER -->
<footer class="bg-dark text-white py-3 mt-5">
    <div class="container text-center">
        <p class="mb-0">
            © 2026 FlashCash - Application de transfert d'argent
        </p>
    </div>
</footer>
</html>
