<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>
<body>
<div th:replace="fragments/header :: header"></div>
<div class="content">
    <div class="container d-flex justify-content-center" style="margin: 7%;">

        <div class="card p-4 shadow" style="width: 450px;">
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <p class="text-center">Add Iban </p>

            <form th:action="@{/addIban}" th:object="${savedIban}" method="post">

                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                </div>

                <div class="mb-3">

                    <input type="text"
                           th:field="*{bankName}"
                           class="form-control mb-2"
                           placeholder="Bank Name">

                    <div th:if="${#fields.hasErrors('bankName')}"
                         th:errors="*{bankName}"
                         class="text-danger"></div>

                    <input type="text"
                           th:field="*{iban}"
                           class="form-control mb-2"
                           placeholder="FR76....">

                    <div th:if="${#fields.hasErrors('iban')}"
                         th:errors="*{iban}"
                         class="text-danger"></div>

                </div>

                <div class="d-grid">
                    <input class="btn-start btn-sm" type="submit" value="Add">
                </div>

            </form>

    </div>
</div>
</div>
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
