<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>
<body>
    <div th:fragment="header">

    <div class="d-flex align-items-center mt-2 px-4">

        <!-- LOGO -->
        <div class="bg-primary text-white rounded-circle d-flex justify-content-center align-items-center"
             style="width:70px;height:70px;">
            <i class="bi bi-wallet2 " style="font-size: 200%"></i>
        </div>

        <!-- TITLE -->
        <div class="ms-3">
            <h1 class="fw-bold text-primary mb-0">
                FlashCash
            </h1>
            <p class="tagline mb-0">Fast and secure transfers</p>
        </div>

        <!-- NAV -->
        <nav class="d-flex gap-4 ms-auto align-items-center">

            <a class="d-flex gap-2 btn btn-primary btn-lg rounded-5 btn-nav bg-clr " th:href="@{/home-profile}">
                <i class="bi bi-house"></i> Home
            </a>

            <a class=" d-flex gap-2 btn btn-primary btn-lg rounded-5 btn-nav" th:href="@{/transfer}">
                <i class="bi bi-arrow-left-right"></i> Transfer
            </a>

            <a class="d-flex gap-2 btn btn-primary btn-lg rounded-5 btn-nav" th:href="@{/profile}">
                <i class="bi bi-wallet"></i> Wallet
            </a>

            <a class="d-flex gap-2 btn btn-primary btn-lg rounded-5 btn-nav" th:href="@{/link}">
                <i class="bi bi-envelope"></i> Contact
            </a>

            <!-- USER -->
            <span class="d-flex gap-2 btn btn-primary btn-lg rounded-5 btn-nav">
            <i class="bi bi-person-circle"></i>
           <span th:text="${user != null ? #strings.capitalize(user.firstName) : ''}"></span>
           <span th:text="${user != null ? #strings.capitalize(user.lastName) : ''}"></span>
        </span>

            <!-- LOGOUT -->
            <a  class="d-flex gap-2 btn btn-primary btn-lg rounded-5 btn-nav"
               href="#"
               onclick="document.getElementById('logout-form').submit()">

                <i class="bi bi-box-arrow-right"></i>
                Logout
            </a>

            <form id="logout-form" th:action="@{/logout}" method="post" style="display:none"></form>

        </nav>

    </div>

</div>
</body>
</html>
