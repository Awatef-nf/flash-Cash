<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>header</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>
<body>
<div th:fragment="header">

<div class="d-flex align-items-center mt-2 ">
    <!-- Logo à gauche -->
    <div class="bg-primary text-white rounded-circle d-flex justify-content-center align-items-center mb-4 "
         style="width:70px;height:70px; margin-left: 10%">
        <i class="bi bi-wallet2 fs-1"></i>
    </div>

    <!-- TITLE -->
    <div class="ms-3">
        <h1 class="fw-bold text-primary mb-0 mt-4">
            FlashCash
        </h1>
        <p class="tagline">Fast and secure transfers</p>
    </div>

    <!-- Liens à droite -->
    <nav class="d-flex gap-4 ms-auto" style="margin-top: -1%">
        <a class="text-decoration-none " th:href="@{/home}">Home</a>
        <a class="text-decoration-none " th:href="@{/transfer}">Transfer</a>
        <a class="text-decoration-none " th:href="@{/profile}">Profile</a>
        <a class="text-decoration-none " th:href="@{/link}">Contact</a>

        <a class="text-decoration-none"
           href="#"
           onclick="document.getElementById('logout-form').submit()">
            Logout
        </a>
        <form id="logout-form" th:action="@{/logout}" method="post" style="display:none"></form>
    </nav>

</div>
</div>
</body>
</html>
